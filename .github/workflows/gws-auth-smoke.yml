name: GWS Auth Smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging
  schedule:
    - cron: "27 7 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gws-auth-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Install NumPy for IAP tunnel performance
        run: |
          PYTHON_BIN="$(gcloud info --format='value(basic.python_location)')"
          if [ -z "$PYTHON_BIN" ]; then
            echo "ERROR: Failed to determine gcloud Python interpreter (basic.python_location is empty)" >&2
            exit 1
          fi
          "$PYTHON_BIN" -m pip install numpy

      - name: Register OS Login SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ ! -f ~/.ssh/google_compute_engine ]]; then
            ssh-keygen -t rsa -b 3072 -f ~/.ssh/google_compute_engine -N "" -q
          fi
          gcloud compute os-login ssh-keys add \
            --key-file ~/.ssh/google_compute_engine.pub \
            --ttl 30m \
            --quiet >/dev/null

      - name: Preflight GCE SSH over IAP
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
          GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME || vars.GCE_INSTANCE_NAME }}
        run: |
          set -euo pipefail

          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${GCP_ZONE:?GCP_ZONE is required}"
          : "${GCE_INSTANCE_NAME:?GCE_INSTANCE_NAME is required}"

          for attempt in 1 2 3 4 5; do
            if gcloud compute ssh "${GCE_INSTANCE_NAME}" \
              --project "${GCP_PROJECT_ID}" \
              --zone "${GCP_ZONE}" \
              --tunnel-through-iap \
              --quiet \
              --command "true" \
              -- \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes; then
              break
            fi

            if [[ "${attempt}" == "5" ]]; then
              echo "ERROR: GCE SSH/IAP preflight failed after ${attempt} attempts." >&2
              exit 1
            fi

            sleep_for=$((attempt * 5))
            echo "GCE SSH/IAP preflight failed on attempt ${attempt}; retrying in ${sleep_for}s..."
            sleep "${sleep_for}"
          done
          echo "GCE SSH/IAP preflight passed for ${GCE_INSTANCE_NAME}"

      - name: Run route-bound GWS auth-health smoke
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
          GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME || vars.GCE_INSTANCE_NAME }}
          VERIFY_GCE_CONTAINER: ${{ secrets.VERIFY_GCE_CONTAINER || vars.VERIFY_GCE_CONTAINER }}
        run: |
          set -euo pipefail

          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${GCP_ZONE:?GCP_ZONE is required}"
          : "${GCE_INSTANCE_NAME:?GCE_INSTANCE_NAME is required}"

          container="${VERIFY_GCE_CONTAINER:-openclaw-gateway}"
          container_escaped="$(printf '%q' "${container}")"

          gce_ssh() {
            gcloud compute ssh "${GCE_INSTANCE_NAME}" \
              --project "${GCP_PROJECT_ID}" \
              --zone "${GCP_ZONE}" \
              --tunnel-through-iap \
              --quiet \
              --command "$1" \
              -- \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes
          }

          gce_ssh_lastline() {
            gce_ssh "$1" | tail -1
          }

          gce_ssh_last_json_line() {
            local output json_line
            output="$(gce_ssh "$1")" || return 1
            json_line="$(printf '%s\n' "${output}" | grep -E '^[{]' | tail -1 || true)"
            [[ -n "${json_line}" ]] || return 2
            printf '%s\n' "${json_line}"
          }

          require_container_script() {
            local script_path="${1:?script path required}"
            local description="${2:?description required}"
            local script_path_escaped
            printf -v script_path_escaped '%q' "${script_path}"
            gce_ssh "sudo docker exec ${container_escaped} bash -lc \"set -euo pipefail; test -r ${script_path_escaped}\"" || {
              echo "Deployed image is missing ${description} at ${script_path}" >&2
              exit 1
            }
          }

          state="$(gce_ssh_lastline "sudo docker ps --filter 'name=^${container}\$' --format '{{.State}}'")"
          state="$(echo "${state}" | tr -d '[:space:]')"
          [[ "${state}" == "running" ]] || {
            echo "Container ${container} is not running on ${GCE_INSTANCE_NAME}" >&2
            exit 1
          }

          require_container_script "scripts/gws/select-delegate-subject.mjs" "GWS delegated subject selector"
          require_container_script "scripts/gws/run-auth-health.mjs" "GWS auth-health runner"
          delegate_subjects_json="$(gce_ssh_last_json_line "sudo docker exec ${container_escaped} bash -lc \"set -euo pipefail; cd /app; node scripts/gws/select-delegate-subject.mjs\"")" || {
            echo "No delegated GWS binding subjects found in ${container}" >&2
            exit 1
          }
          baseline_subject="$(jq -r '.baselineSubject // empty' <<<"${delegate_subjects_json}")"
          [[ "${baseline_subject}" =~ ^(agent|subagent):[A-Za-z0-9._-]+$ ]] || {
            echo "No configured GWS baseline binding subject found in ${container}" >&2
            exit 1
          }
          mapfile -t delegate_subject_candidates < <(jq -r '.delegateSubjects[]?' <<<"${delegate_subjects_json}")
          [[ "${#delegate_subject_candidates[@]}" -gt 0 ]] || {
            echo "No additional non-baseline delegated GWS binding subject candidates found in ${container}" >&2
            exit 1
          }

          run_auth_health_payload() {
            local subject="${1:?subject required}"
            local subject_escaped payload
            [[ "${subject}" =~ ^(agent|subagent):[A-Za-z0-9._-]+$ ]] || {
              return 2
            }
            printf -v subject_escaped '%q' "${subject}"
            payload="$(
              gce_ssh_last_json_line "sudo docker exec ${container_escaped} bash -lc \"set -euo pipefail; cd /app; node scripts/gws/run-auth-health.mjs --subject ${subject_escaped}\""
            )" || return 1
            printf '%s\n' "${payload}"
          }

          validate_auth_health_payload() {
            local subject="${1:?subject required}"
            local payload="${2:?payload required}"
            printf '%s\n' "${payload}"
            jq -e '.ok == true' >/dev/null <<<"${payload}" \
              || return 1
            jq -e --arg subject "${subject}" '.data.route.bindingSubject == $subject' >/dev/null <<<"${payload}" \
              || return 1
            jq -e '.data.authHealth.tokenValid == true and ((.data.authHealth.tokenError // "") == "")' >/dev/null <<<"${payload}" \
              || return 1
          }

          baseline_payload="$(run_auth_health_payload "${baseline_subject}")" || {
            echo "auth-health command failed for ${baseline_subject}" >&2
            exit 1
          }
          validate_auth_health_payload "${baseline_subject}" "${baseline_payload}" || {
            echo "auth-health baseline checks failed for ${baseline_subject}" >&2
            exit 1
          }
          jq -e '.data.authHealth.credentialSourceType == "service_account_json"' >/dev/null <<<"${baseline_payload}" \
            || { echo "auth-health credential source drifted for ${baseline_subject}" >&2; exit 1; }
          jq -e '.data.authHealth.serviceAccountPolicyEnforced == true and .data.authHealth.serviceAccountPolicyCompliant == true' >/dev/null <<<"${baseline_payload}" \
            || { echo "auth-health service-account policy check failed for ${baseline_subject}" >&2; exit 1; }

          delegate_subject=""
          for candidate_subject in "${delegate_subject_candidates[@]}"; do
            candidate_subject="$(echo "${candidate_subject}" | tr -d '[:space:]')"
            [[ "${candidate_subject}" =~ ^(agent|subagent):[A-Za-z0-9._-]+$ ]] || {
              echo "Skipping invalid delegated subject candidate: ${candidate_subject:-<empty>}" >&2
              continue
            }

            candidate_payload="$(run_auth_health_payload "${candidate_subject}")" || {
              echo "auth-health command failed for ${candidate_subject}; trying next candidate" >&2
              continue
            }
            if ! validate_auth_health_payload "${candidate_subject}" "${candidate_payload}"; then
              echo "auth-health baseline checks failed for ${candidate_subject}; trying next candidate" >&2
              continue
            fi
            if ! jq -e '.data.authHealth.credentialSourceType == "service_account_json"' >/dev/null <<<"${candidate_payload}"; then
              echo "auth-health credential source is not service_account_json for ${candidate_subject}; trying next candidate" >&2
              continue
            fi
            if ! jq -e '.data.authHealth.serviceAccountPolicyEnforced == true and .data.authHealth.serviceAccountPolicyCompliant == true' >/dev/null <<<"${candidate_payload}"; then
              echo "auth-health service-account policy check failed for ${candidate_subject}; trying next candidate" >&2
              continue
            fi

            delegate_subject="${candidate_subject}"
            break
          done

          [[ -n "${delegate_subject}" ]] || {
            echo "No delegated GWS binding subject passed service-account auth-health policy gates" >&2
            exit 1
          }

          echo "GWS auth-health smoke passed for ${baseline_subject} and ${delegate_subject}"

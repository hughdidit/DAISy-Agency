name: Verify

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      deployed_ref:
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deployed_ref:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Install NumPy for IAP tunnel performance
        run: |
          PYTHON_BIN="$(gcloud info --format='value(basic.python_location)')"
          if [ -z "$PYTHON_BIN" ]; then
            echo "ERROR: Failed to determine gcloud Python interpreter (basic.python_location is empty)" >&2
            exit 1
          fi
          "$PYTHON_BIN" -m pip install numpy

      - name: Register OS Login SSH key
        run: |
          # Generate and import the SSH key before verify.sh makes any
          # gcloud compute ssh calls. This keeps WIF-backed verification
          # self-contained on fresh GitHub-hosted runners.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ ! -f ~/.ssh/google_compute_engine ]]; then
            ssh-keygen -t rsa -b 3072 -f ~/.ssh/google_compute_engine -N "" -q
          fi
          gcloud compute os-login ssh-keys add \
            --key-file ~/.ssh/google_compute_engine.pub \
            --ttl 30m \
            --quiet >/dev/null

      - name: Preflight GCE SSH over IAP
        env:
          GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME || vars.GCE_INSTANCE_NAME }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
        run: |
          : "${GCE_INSTANCE_NAME:?GCE_INSTANCE_NAME is required}"
          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${GCP_ZONE:?GCP_ZONE is required}"

          gcloud compute ssh "${GCE_INSTANCE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --zone "${GCP_ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command "true" \
            -- \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes
          echo "GCE SSH/IAP preflight passed for ${GCE_INSTANCE_NAME}"

      - name: Run verification
        run: |
          chmod +x scripts/verify.sh
          chmod +x scripts/verify/run-sandbox-first-acceptance.sh
          # scripts/verify.sh validates any deploy-time sandbox browser image requirement.
          scripts/verify.sh
        env:
          VERIFY_ENV: ${{ inputs.environment }}
          DEPLOYED_REF: ${{ inputs.deployed_ref }}
          VERIFY_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/verify
          # GCE health check (moltbot health --json via gcloud SSH)
          GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME || vars.GCE_INSTANCE_NAME }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
          VERIFY_GCE_CONTAINER: ${{ secrets.VERIFY_GCE_CONTAINER || vars.VERIFY_GCE_CONTAINER }}
          VERIFY_HEALTH_TIMEOUT: ${{ vars.VERIFY_HEALTH_TIMEOUT }}

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-${{ inputs.environment }}-${{ github.run_id }}
          path: .artifacts/verify
          if-no-files-found: ignore

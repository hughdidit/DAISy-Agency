name: CI

on:
  pull_request:
    branches:
      - daisy/main
      - daisy/dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect docs-only changes to skip heavy jobs (test, build, iOS, Android).
  # Node lint/format stays scoped with the Node lane; fail-safe is to run everything.
  docs-scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      docs_changed: ${{ steps.check.outputs.docs_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Detect docs-only changes
        id: check
        uses: ./.github/actions/detect-docs-changes

  # Detect which heavy areas are touched so PRs can skip unrelated expensive jobs.
  # Manual dispatch falls back to broad coverage.
  changed-scope:
    needs: [docs-scope]
    if: needs.docs-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      run_node: ${{ steps.scope.outputs.run_node }}
      run_ios: ${{ steps.scope.outputs.run_ios }}
      run_android: ${{ steps.scope.outputs.run_android }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Detect changed scopes
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=""
          fi

          node scripts/ci-changed-scope.mjs --base "$BASE" --head HEAD

  # Keep a dedicated Linux build smoke gate for Node-relevant changes.
  build-artifacts:
    needs: [docs-scope, changed-scope]
    if: needs.docs-scope.outputs.docs_only != 'true' && needs.changed-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Build dist
        run: pnpm build

  anti-mock:
    name: anti-mock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"
          install-deps: "false"

      - name: Block new mock-pattern files
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'allow-new-mock-files') }}" = "true" ]; then
            echo "Bypassing anti-mock gate because PR label allow-new-mock-files is present."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
            BASE="$(git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}")"
          else
            git fetch --no-tags --depth=1 origin daisy/dev
            BASE="$(git merge-base HEAD origin/daisy/dev)"
          fi

          node scripts/check-no-new-mock-files.mjs --base "$BASE" --head HEAD

  checks:
    needs: [docs-scope, changed-scope]
    if: needs.docs-scope.outputs.docs_only != 'true' && needs.changed-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            task: test shard 1/2
            shard_index: 1
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: test shard 2/2
            shard_index: 2
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: protocol
            command: pnpm protocol:check
          - runtime: node
            task: gws-toolkit-phase1
            command: pnpm -C extensions/gws-toolkit-phase1 test:acceptance && pnpm -C extensions/gws-toolkit-phase1 test && pnpm -C extensions/gws-toolkit-phase1 lint
          - runtime: bun
            task: test
            command: pnpm canvas:a2ui:bundle && bunx vitest run --config vitest.unit.config.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "${{ matrix.runtime == 'bun' }}"
          use-sticky-disk: "false"

      - name: Configure Node test resources
        if: startsWith(matrix.task, 'test shard') && matrix.runtime == 'node'
        run: |
          # `pnpm test` runs `scripts/test-parallel.mjs`, which spawns multiple Node processes.
          # ubuntu-latest has ~7GB RAM; single worker avoids OOM (test suite needs ~3.5GB).
          echo "OPENCLAW_TEST_SHARDS=2" >> "$GITHUB_ENV"
          echo "OPENCLAW_TEST_SHARD_INDEX=${{ matrix.shard_index }}" >> "$GITHUB_ENV"
          echo "OPENCLAW_TEST_WORKERS=1" >> "$GITHUB_ENV"
          echo "OPENCLAW_TEST_MAX_OLD_SPACE_SIZE_MB=5120" >> "$GITHUB_ENV"
          # Disable vmForks: with 1 worker, vmForks spawns 2 parallel vitest processes
          # (unit-fast + unit-isolated) whose combined heap (~10GB) exceeds runner RAM.
          # Regular forks collapses to a single vitest process, halving memory usage.
          echo "OPENCLAW_TEST_VM_FORKS=0" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.task }} (${{ matrix.runtime }})
        run: ${{ matrix.command }}

  # Types, lint, and format check.
  check:
    name: "check"
    needs: [docs-scope, changed-scope]
    if: needs.docs-scope.outputs.docs_only != 'true' && needs.changed-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Check types and lint and oxfmt
        run: pnpm check

      - name: Strict TS build smoke
        run: pnpm build:strict-smoke

      - name: Enforce safe external URL opening policy
        run: pnpm lint:ui:no-raw-window-open

  # Report-only dead-code scans. Runs after scope detection and stores machine-readable
  # results as artifacts for later triage before we enable hard gates.
  # Temporarily disabled in CI while we process initial findings.
  deadcode:
    name: dead-code report
    needs: [docs-scope, changed-scope]
    # if: needs.docs-scope.outputs.docs_only != 'true' && needs.changed-scope.outputs.run_node == 'true'
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: knip
            command: pnpm deadcode:report:ci:knip
          - tool: ts-prune
            command: pnpm deadcode:report:ci:ts-prune
          - tool: ts-unused-exports
            command: pnpm deadcode:report:ci:ts-unused
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Run ${{ matrix.tool }} dead-code scan
        run: ${{ matrix.command }}

      - name: Upload dead-code results
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-${{ matrix.tool }}-${{ github.run_id }}
          path: .artifacts/deadcode

  # Validate docs (format, lint, broken links) only when docs files changed.
  check-docs:
    needs: [docs-scope]
    if: needs.docs-scope.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Check docs
        run: pnpm check:docs

  skills-python:
    needs: [docs-scope, changed-scope]
    if: needs.docs-scope.outputs.docs_only != 'true' && needs.changed-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pyyaml

      - name: Lint Python skill scripts
        run: python -m ruff check skills

      - name: Test skill Python scripts
        run: python -m pytest -q skills

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-sticky-disk: "false"
          install-deps: "false"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit detect-secrets==1.5.0

      - name: Detect secrets
        run: |
          if ! detect-secrets scan --baseline .secrets.baseline; then
            echo "::error::Secret scanning failed. See docs/gateway/security.md#secret-scanning-detect-secrets"
            exit 1
          fi

      - name: Detect committed private keys
        run: pre-commit run --all-files detect-private-key

      - name: Audit changed GitHub workflows with zizmor
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags --depth=1 origin daisy/dev
            BASE="$(git merge-base HEAD origin/daisy/dev)"
          fi

          mapfile -t workflow_files < <(git diff --name-only "$BASE" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow changes detected; skipping zizmor."
            exit 0
          fi

          pre-commit run zizmor --files "${workflow_files[@]}"

      - name: Audit production dependencies
        env:
          APP_ENV: ${{ vars.APP_ENV || 'staging' }}
        run: |
          set -euo pipefail
          echo "APP_ENV=${APP_ENV}"
          if [ "$APP_ENV" = "staging" ] || [ "$APP_ENV" = "production" ]; then
            pnpm install --lockfile-only --ignore-scripts
            # npm retired legacy audit endpoints used by pnpm audit in current stable.
            # Use npm's bulk advisory endpoint directly until pnpm endpoint migration is complete.
            node ./scripts/audit-prod-deps-bulk.mjs --level high
          else
            echo "Skipping dependency audit (APP_ENV=${APP_ENV})"
          fi

  ios:
    needs: [docs-scope, changed-scope, check]
    if: always() && needs.docs-scope.outputs.docs_only != 'true' && needs.changed-scope.outputs.run_ios == 'true' && needs.check.result != 'failure' && needs.check.result != 'cancelled'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install SwiftLint / SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Generate iOS project
        run: |
          cd apps/ios
          xcodegen generate

      - name: iOS tests
        run: |
          set -euo pipefail
          RESULT_BUNDLE_PATH="$RUNNER_TEMP/Clawdis-iOS.xcresult"
          DEST_ID="$(
            python3 - <<'PY'
          import json
          import subprocess
          import sys
          import uuid

          def sh(args: list[str]) -> str:
            return subprocess.check_output(args, text=True).strip()

          # Prefer an already-created iPhone simulator if it exists.
          devices = json.loads(sh(["xcrun", "simctl", "list", "devices", "-j"]))
          candidates: list[tuple[str, str]] = []
          for runtime, devs in (devices.get("devices") or {}).items():
            for dev in devs or []:
              if not dev.get("isAvailable"):
                continue
              name = str(dev.get("name") or "")
              udid = str(dev.get("udid") or "")
              if not udid or not name.startswith("iPhone"):
                continue
              candidates.append((name, udid))

          candidates.sort(key=lambda it: (0 if "iPhone 16" in it[0] else 1, it[0]))
          if candidates:
            print(candidates[0][1])
            sys.exit(0)

          # Otherwise, create one from the newest available iOS runtime.
          runtimes = json.loads(sh(["xcrun", "simctl", "list", "runtimes", "-j"])).get("runtimes") or []
          ios = [rt for rt in runtimes if rt.get("platform") == "iOS" and rt.get("isAvailable")]
          if not ios:
            print("No available iOS runtimes found.", file=sys.stderr)
            sys.exit(1)

          def version_key(rt: dict) -> tuple[int, ...]:
            parts: list[int] = []
            for p in str(rt.get("version") or "0").split("."):
              try:
                parts.append(int(p))
              except ValueError:
                parts.append(0)
            return tuple(parts)

          ios.sort(key=version_key, reverse=True)
          runtime = ios[0]
          runtime_id = str(runtime.get("identifier") or "")
          if not runtime_id:
            print("Missing iOS runtime identifier.", file=sys.stderr)
            sys.exit(1)

          supported = runtime.get("supportedDeviceTypes") or []
          iphones = [dt for dt in supported if dt.get("productFamily") == "iPhone"]
          if not iphones:
            print("No iPhone device types for iOS runtime.", file=sys.stderr)
            sys.exit(1)

          iphones.sort(
            key=lambda dt: (
              0 if "iPhone 16" in str(dt.get("name") or "") else 1,
              str(dt.get("name") or ""),
            )
          )
          device_type_id = str(iphones[0].get("identifier") or "")
          if not device_type_id:
            print("Missing iPhone device type identifier.", file=sys.stderr)
            sys.exit(1)

          sim_name = f"CI iPhone {uuid.uuid4().hex[:8]}"
          udid = sh(["xcrun", "simctl", "create", sim_name, device_type_id, runtime_id])
          if not udid:
            print("Failed to create iPhone simulator.", file=sys.stderr)
            sys.exit(1)
          print(udid)
          PY
          )"
          echo "Using iOS Simulator id: $DEST_ID"
          xcodebuild test \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -destination "platform=iOS Simulator,id=$DEST_ID" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -enableCodeCoverage YES

      - name: iOS coverage summary
        run: |
          set -euo pipefail
          RESULT_BUNDLE_PATH="$RUNNER_TEMP/Clawdis-iOS.xcresult"
          xcrun xccov view --report --only-targets "$RESULT_BUNDLE_PATH"

      - name: iOS coverage gate (43%)
        run: |
          set -euo pipefail
          RESULT_BUNDLE_PATH="$RUNNER_TEMP/Clawdis-iOS.xcresult"
          RESULT_BUNDLE_PATH="$RESULT_BUNDLE_PATH" python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          target_name = "OpenClaw.app"
          minimum = 0.43

          report = json.loads(
            subprocess.check_output(
              ["xcrun", "xccov", "view", "--report", "--json", os.environ["RESULT_BUNDLE_PATH"]],
              text=True,
            )
          )

          target_coverage = None
          for target in report.get("targets", []):
            if target.get("name") == target_name:
              target_coverage = float(target["lineCoverage"])
              break

          if target_coverage is None:
            print(f"Could not find coverage for target: {target_name}")
            sys.exit(1)

          print(f"{target_name} line coverage: {target_coverage * 100:.2f}% (min {minimum * 100:.2f}%)")
          if target_coverage + 1e-12 < minimum:
            sys.exit(1)
          PY

  android:
    needs: [docs-scope, changed-scope]
    if: needs.docs-scope.outputs.docs_only != 'true' && needs.changed-scope.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: test
            command: ./gradlew --no-daemon :app:testDebugUnitTest
          - task: build
            command: ./gradlew --no-daemon :app:assembleDebug
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # setup-android's sdkmanager currently crashes on JDK 21 in CI.
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run Android ${{ matrix.task }}
        working-directory: apps/android
        run: ${{ matrix.command }}

  linux-required:
    name: CI / Linux Required
    if: always() && github.event_name == 'pull_request'
    needs:
      [docs-scope, changed-scope, anti-mock, secrets, build-artifacts, check, checks, skills-python]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate Linux required jobs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.docs-scope.result }}" != "success" ]; then
            echo "docs-scope did not succeed: ${{ needs.docs-scope.result }}"
            exit 1
          fi

          if [ "${{ needs.docs-scope.outputs.docs_only }}" = "true" ]; then
            echo "Docs-only PR; Linux gate not required."
            exit 0
          fi

          if [ "${{ needs.changed-scope.result }}" != "success" ]; then
            echo "changed-scope did not succeed: ${{ needs.changed-scope.result }}"
            exit 1
          fi

          if [ "${{ needs.changed-scope.outputs.run_node }}" != "true" ]; then
            echo "No Node-relevant changes; Linux gate not required."
            exit 0
          fi

          for result in \
            "${{ needs.anti-mock.result }}" \
            "${{ needs.secrets.result }}" \
            "${{ needs.build-artifacts.result }}" \
            "${{ needs.check.result }}" \
            "${{ needs.checks.result }}" \
            "${{ needs.skills-python.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Required Linux job did not succeed: $result"
              exit 1
            fi
          done

  ios-required:
    name: CI / iOS Required
    if: always() && github.event_name == 'pull_request'
    needs: [docs-scope, changed-scope, ios]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate iOS required job
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.docs-scope.result }}" != "success" ]; then
            echo "docs-scope did not succeed: ${{ needs.docs-scope.result }}"
            exit 1
          fi

          if [ "${{ needs.docs-scope.outputs.docs_only }}" = "true" ]; then
            echo "Docs-only PR; iOS gate not required."
            exit 0
          fi

          if [ "${{ needs.changed-scope.result }}" != "success" ]; then
            echo "changed-scope did not succeed: ${{ needs.changed-scope.result }}"
            exit 1
          fi

          if [ "${{ needs.changed-scope.outputs.run_ios }}" != "true" ]; then
            echo "No iOS-relevant changes; iOS gate not required."
            exit 0
          fi

          if [ "${{ needs.ios.result }}" != "success" ]; then
            echo "Required iOS job did not succeed: ${{ needs.ios.result }}"
            exit 1
          fi

  android-required:
    name: CI / Android Required
    if: always() && github.event_name == 'pull_request'
    needs: [docs-scope, changed-scope, android]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate Android required job
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.docs-scope.result }}" != "success" ]; then
            echo "docs-scope did not succeed: ${{ needs.docs-scope.result }}"
            exit 1
          fi

          if [ "${{ needs.docs-scope.outputs.docs_only }}" = "true" ]; then
            echo "Docs-only PR; Android gate not required."
            exit 0
          fi

          if [ "${{ needs.changed-scope.result }}" != "success" ]; then
            echo "changed-scope did not succeed: ${{ needs.changed-scope.result }}"
            exit 1
          fi

          if [ "${{ needs.changed-scope.outputs.run_android }}" != "true" ]; then
            echo "No Android-relevant changes; Android gate not required."
            exit 0
          fi

          if [ "${{ needs.android.result }}" != "success" ]; then
            echo "Required Android job did not succeed: ${{ needs.android.result }}"
            exit 1
          fi

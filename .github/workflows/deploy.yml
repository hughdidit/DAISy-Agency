name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      release_run_id:
        description: "Docker release workflow run ID (source of release-metadata)"
        required: true
      image_ref:
        description: "Optional override: full image ref (tag or digest)"
        required: false
      dry_run:
        description: "If true, do not perform real deployment"
        required: true
        default: true
        type: boolean
      provision:
        description: "If true, provision VM with docker-compose.yml before deploy"
        required: false
        default: false
        type: boolean
      with_monitoring:
        description: "If true, deploy monitoring stack alongside the app"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      image_ref:
        required: false
        type: string
      dry_run:
        required: true
        type: boolean
      provision:
        required: false
        type: boolean
      with_monitoring:
        required: false
        type: boolean
        default: true
    secrets:
      GHCR_USERNAME:
        description: GitHub username for GHCR
        required: true
      GHCR_TOKEN:
        description: PAT with read:packages scope
        required: true
      OPENCLAW_GATEWAY_TOKEN:
        description: Gateway authentication token
        required: true
      DISCORD_BOT_TOKEN:
        description: Discord bot token
        required: true
      ANTHROPIC_API_KEY:
        description: Anthropic API key for Claude model access
        required: true
      OPENAI_API_KEY:
        description: OpenAI API key for OpenAI-backed model and tool access
        required: false
      MONGODB_URI:
        description: MongoDB connection URI (optional, memory plugin only)
        required: false
      GEMINI_API_KEY:
        description: Gemini API key for embeddings (optional, memory plugin only)
        required: false
      BRAVE_API_KEY:
        description: Brave Web Search API key (optional, for web-search tool)
        required: false
      FIRECRAWL_API_KEY:
        description: Firecrawl API key (optional, for firecrawl-enabled environments)
        required: false
      TRELLO_API_KEY:
        description: Trello API key (optional, for Trello integration)
        required: false
      TRELLO_TOKEN:
        description: Trello token (optional, for Trello integration)
        required: false
      GOOGLE_WORKSPACE_CLI_TOKEN:
        description: Google Workspace CLI bearer token (optional, for gws-toolkit-phase1 token route mode)
        required: false
      GWS_CREDENTIALS:
        description: Google Workspace CLI exported credentials JSON (optional, for gws-toolkit-phase1 credentials_file route mode)
        required: false
      GRAFANA_ADMIN_PASSWORD:
        description: Grafana admin password
        required: false
      DISCORD_ALERTS_WEBHOOK_URL:
        description: Discord webhook URL for Alertmanager notifications
        required: false
      ALERT_SMTP_USERNAME:
        description: SMTP authentication username
        required: false
      ALERT_SMTP_PASSWORD:
        description: SMTP authentication password
        required: false

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4

      - name: Download release metadata from docker-release run
        if: ${{ !inputs.image_ref }}
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: dist/release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Help - release metadata download failed
        if: ${{ failure() && !inputs.image_ref }}
        run: |
          echo "ERROR: Failed to download artifact 'release-metadata' for run-id='${{ inputs.release_run_id }}'." >&2
          echo "Use the Run ID from the Docker release workflow run that uploaded 'release-metadata'." >&2
          exit 2

      - name: Show release metadata
        if: ${{ !inputs.image_ref }}
        run: |
          ls -la dist/release
          cat dist/release/release-metadata.json

      - name: Validate required config
        env:
          # Infrastructure (secrets, with vars fallback for migration)
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
          GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME || vars.GCE_INSTANCE_NAME }}
          # Variables (non-sensitive config - short values that would cause log masking issues as secrets)
          OPENCLAW_GATEWAY_PORT: ${{ vars.OPENCLAW_GATEWAY_PORT }}
          OPENCLAW_BRIDGE_PORT: ${{ vars.OPENCLAW_BRIDGE_PORT }}
          OPENCLAW_GATEWAY_BIND: ${{ vars.OPENCLAW_GATEWAY_BIND || 'loopback' }}
          OPENCLAW_CONFIG_FILE: ${{ vars.OPENCLAW_CONFIG_FILE || 'openclaw.json' }}
          # Secrets (credentials)
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          GOOGLE_WORKSPACE_CLI_TOKEN: ${{ secrets.GOOGLE_WORKSPACE_CLI_TOKEN }}
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
        run: |
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?GCP_WORKLOAD_IDENTITY_PROVIDER is required}"
          : "${GCP_SERVICE_ACCOUNT:?GCP_SERVICE_ACCOUNT is required}"
          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}"
          : "${GCP_ZONE:?GCP_ZONE is required}"
          : "${GCE_INSTANCE_NAME:?GCE_INSTANCE_NAME is required}"
          : "${OPENCLAW_GATEWAY_PORT:?OPENCLAW_GATEWAY_PORT is required}"
          : "${OPENCLAW_BRIDGE_PORT:?OPENCLAW_BRIDGE_PORT is required}"
          : "${GHCR_USERNAME:?GHCR_USERNAME is required}"
          : "${GHCR_TOKEN:?GHCR_TOKEN is required}"
          : "${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}"
          : "${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}"
          : "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}"
          # Validate OPENCLAW_CONFIG_FILE is a simple filename (no path separators)
          case "${OPENCLAW_CONFIG_FILE}" in
            *"/"*|*".."*) echo "ERROR: OPENCLAW_CONFIG_FILE must be a simple filename (got: ${OPENCLAW_CONFIG_FILE})" >&2; exit 1 ;;
          esac

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Install NumPy for IAP tunnel performance
        run: |
          PYTHON_BIN="$(gcloud info --format='value(basic.python_location)')"
          if [ -z "$PYTHON_BIN" ]; then
            echo "ERROR: Failed to determine gcloud Python interpreter (basic.python_location is empty)" >&2
            exit 1
          fi
          "$PYTHON_BIN" -m pip install numpy

      - name: Register OS Login SSH key
        if: ${{ !inputs.dry_run }}
        run: |
          # Generate and import the SSH key before deploy.sh pipes data into
          # gcloud compute ssh. This makes OS Login key registration explicit
          # for WIF service-account deploys and keeps key material out of logs.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ ! -f ~/.ssh/google_compute_engine ]]; then
            ssh-keygen -t rsa -b 3072 -f ~/.ssh/google_compute_engine -N "" -q
          fi
          gcloud compute os-login ssh-keys add \
            --key-file ~/.ssh/google_compute_engine.pub \
            --ttl 30m \
            --quiet >/dev/null

      - name: Resolve deploy image ref
        id: resolve
        env:
          IMAGE_REF_OVERRIDE: ${{ inputs.image_ref }}
        run: |
          if [[ -n "${IMAGE_REF_OVERRIDE}" ]]; then
            echo "resolved_ref=${IMAGE_REF_OVERRIDE}" >> "$GITHUB_OUTPUT"
            echo "Resolved ref (override): ${IMAGE_REF_OVERRIDE}"
          else
            chmod +x scripts/read-release-metadata.sh
            chmod +x scripts/deploy.sh
            RESOLVED="$(bash scripts/deploy.sh --resolve-only dist/release/release-metadata.json)"
            echo "resolved_ref=${RESOLVED}" >> "$GITHUB_OUTPUT"
            echo "Resolved ref: ${RESOLVED}"
          fi

      - name: GHCR preflight
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RESOLVED_REF: ${{ steps.resolve.outputs.resolved_ref }}
        run: |
          : "${GHCR_USERNAME:?GHCR_USERNAME is required}"
          : "${GHCR_TOKEN:?GHCR_TOKEN is required}"
          : "${RESOLVED_REF:?resolved_ref is required}"

          docker logout ghcr.io >/dev/null 2>&1 || true
          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          login_output=""
          if ! login_output="$(printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin 2>&1)"; then
            printf '%s\n' "${login_output}" >&2
            echo "::error::GHCR login failed for '${GHCR_USERNAME}'. Rotate GHCR_TOKEN to a personal access token (classic) with at least read:packages, ensure GHCR_USERNAME matches the token owner, and authorize SSO if required."
            exit 1
          fi

          manifest_output=""
          if ! manifest_output="$(docker manifest inspect "${RESOLVED_REF}" 2>&1)"; then
            if [[ -n "${manifest_output}" ]]; then
              printf '%s\n' "${manifest_output}" >&2
            fi
            echo "::error::GHCR login succeeded for '${GHCR_USERNAME}', but '${RESOLVED_REF}' is not readable. The token owner may lack package access, package visibility may have changed, or the expected tag is missing."
            exit 1
          fi

          echo "GHCR preflight passed for ${RESOLVED_REF}"

      - name: Deploy
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          DAISY_ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          IMAGE_REF_OVERRIDE: ${{ inputs.image_ref }}
          # Infrastructure (secrets, with vars fallback for migration)
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
          GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME || vars.GCE_INSTANCE_NAME }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || vars.DEPLOY_DIR }}
          # Variables (non-sensitive config - short values that would cause log masking issues as secrets)
          OPENCLAW_GATEWAY_PORT: ${{ vars.OPENCLAW_GATEWAY_PORT }}
          OPENCLAW_BRIDGE_PORT: ${{ vars.OPENCLAW_BRIDGE_PORT }}
          OPENCLAW_GATEWAY_BIND: ${{ vars.OPENCLAW_GATEWAY_BIND || 'loopback' }}
          OPENCLAW_CONFIG_FILE: ${{ vars.OPENCLAW_CONFIG_FILE || 'openclaw.json' }}
          # Secrets (credentials)
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          GOOGLE_WORKSPACE_CLI_TOKEN: ${{ secrets.GOOGLE_WORKSPACE_CLI_TOKEN }}
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
          # Monitoring secrets (credentials)
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          DISCORD_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
          ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          # Monitoring config (non-sensitive, from environment variables)
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_SMTP_HOST: ${{ vars.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT }}
          ALERT_SMTP_FROM: ${{ vars.ALERT_SMTP_FROM }}
        run: |
          PROVISION_FLAG=""
          if [[ "${{ inputs.provision }}" == "true" ]]; then
            PROVISION_FLAG="--provision"
          fi
          MONITORING_FLAG=""
          if [[ "${{ inputs.with_monitoring }}" == "true" ]]; then
            MONITORING_FLAG="--with-monitoring"
          fi
          # The deploy script now provisions the sandbox browser image from GHCR
          # when the selected config enables agents.defaults.sandbox.browser.enabled.
          bash scripts/deploy.sh ${PROVISION_FLAG} ${MONITORING_FLAG} dist/release/release-metadata.json

      - name: Deploy summary
        if: ${{ inputs.dry_run != true }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
          GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME || vars.GCE_INSTANCE_NAME }}
          OPENCLAW_GATEWAY_PORT: ${{ vars.OPENCLAW_GATEWAY_PORT }}
        run: |
          : "${OPENCLAW_GATEWAY_PORT:?OPENCLAW_GATEWAY_PORT is required}"
          PORT="${OPENCLAW_GATEWAY_PORT}"
          echo ""
          echo "=== Deploy complete ==="
          echo "Dashboard: http://localhost:${PORT}/ui/overview?token=<OPENCLAW_GATEWAY_TOKEN>"
          echo ""
          echo "IAP tunnel:"
          echo "  gcloud compute ssh ${GCE_INSTANCE_NAME} --project ${GCP_PROJECT_ID} --zone ${GCP_ZONE} --tunnel-through-iap -- -L ${PORT}:localhost:${PORT}"
